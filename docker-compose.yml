services:
  app:
    build: .
    env_file:
      - config.env
    ports:
      - "8080:8080"
    container_name: walletapp
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks:
      - walletapp-net

  postgres:
    image: postgres:18-alpine
    container_name: walletapp-postgres
    env_file:
      - config.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - walletapp-net

volumes:
  postgres_data:

networks:
  walletapp-net:
    driver: bridge
